name: Generate lockfile

on:
  push:
    branches:
      - security/api-hardening-v1

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'Patrik2020/-kalkulator-bazis-currency-api' && github.ref == 'refs/heads/security/api-hardening-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/api-hardening-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:security/api-hardening-v1
